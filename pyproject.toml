[project]
name = "ai-localization-checker"
version = "0.1.0"
description = "Vision-LLM localization defect detector for mobile games, evaluated against an OCR baseline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l10n_checker"]

[project.scripts]
l10n-capture = "l10n_checker.cli:main"
l10n-check = "l10n_checker.cli:check_main"
l10n-baseline = "l10n_checker.baseline_cli:main"
l10n-slice = "l10n_checker.slice_cli:main"
l10n-reference = "l10n_checker.reference_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["device: requires a prepared emulator"]
