[project]
name = "ai-localization-checker"
version = "0.1.0"
description = "Vision-LLM localization defect detector for mobile games, evaluated against an OCR baseline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.31.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l10n_checker"]

[project.scripts]
l10n-capture = "l10n_checker.cli:main"
l10n-check = "l10n_checker.cli:check_main"
l10n-small-text = "l10n_checker.small_text:main"
l10n-small-text-resume = "l10n_checker.small_text_resume:main"
l10n-small-text-local = "l10n_checker.small_text_local:main"
l10n-small-text-deepseek = "l10n_checker.small_text_deepseek:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["device: requires a prepared emulator"]
