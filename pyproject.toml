[project]
name = "ai-localization-checker"
version = "0.1.0"
description = "Vision-LLM localization defect detector for mobile games, evaluated against an OCR baseline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "appium-python-client>=6.0.7",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l10n_checker"]

[project.scripts]
l10n-capture = "l10n_checker.cli:main"

[tool.pytest.ini_options]
markers = ["device: requires a prepared emulator and the project-local Appium server"]
